{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Cloud{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    {% if messages %}
        <div class="flash-message">
            {% for message in messages %}
                <p class="{{ message.tags }} notification">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <div class="header">
        <h1>Bienvenue, {{ request.user.username }}</h1>
        <form class="action-btn" method="post" action="{% url 'logout' %}">{% csrf_token %}
            <button type="submit" class="btn btn-danger">Logout</button>
        </form>
    </div>

    <div class="content">
        <div style="display: flex; gap: 20px; align-items: center;">
            <h2>Location: {{ folder.full_path }}</h2>
            <button onclick="openSubfolderModal()">Create Subfolder</button>
        </div>
        {% block content %}{% endblock %}
    </div>

    <div id="subfolderModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <button class="close-btn" onclick="closeSubfolderModal()">×</button>
            <form id="subfolderForm">
                {% csrf_token %}
                <label for="subfolderName">Name</label>
                <p><input type="text" id="subfolderName" name="name" required></p>
                <p><button type="submit">Create</button></p>
            </form>
        </div>
    </div>

    <script>
        function openSubfolderModal() {
            document.getElementById('subfolderModal').style.display = 'flex';
        }

        function closeSubfolderModal() {
            document.getElementById('subfolderModal').style.display = 'none';
        }

        document.getElementById('subfolderForm').onsubmit = function(e) {
            e.preventDefault();
            const name = document.getElementById('subfolderName').value;
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            fetch(`{% url 'create_subfolder' %}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                },
                body: JSON.stringify({ parent_id: "{{ folder.id }}", name: name })
            }).then(response => response.json()).then(data => {
                if (data.success) {
                    location.reload();
                } else {
                    alert('Failed to create subfolder.');
                }
            });
        }

        function deleteFile(fileId) {
            if (confirm('Are you sure you want to delete this file?')) {
                fetch("{% url 'delete_file' %}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}',
                    },
                    body: JSON.stringify({file_id: fileId})
                }).then(response => {
                    if (response.ok) {
                        location.reload();
                    } else {
                        alert('Failed to delete file.');
                    }
                });
            }
        }
    </script>
</body>
</html>
